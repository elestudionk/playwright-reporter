# nk.proof — end-to-end tests of this project, reported to nk.proof.
# Copy to .github/workflows/nkproof.yml in the client's repository.
#
# Runs on GitHub's runners:
#   - on every PR: waits for the deploy preview (Vercel or Netlify) and tests
#     it. Make "e2e" a required status check on the production branch so a
#     failure blocks the merge;
#   - on demand (workflow_dispatch), used by nk.proof for "Correr" and schedules.
#
# Repo settings (Settings → Secrets and variables → Actions):
#   secrets  NKPROOF_TOKEN                    project token (nk.proof → project → Configuración)
#            VERCEL_AUTOMATION_BYPASS_SECRET  only for protected Vercel previews
#            (plus whatever the tests need to log in, e.g. E2E_PASSWORD)
#   vars     NKPROOF_URL                      e.g. https://proof.nk.studio

name: nk.proof

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL to test
        required: true
      nkproof_run_id:
        description: Run queued in nk.proof (set by nk.proof)
        required: false
      source:
        description: schedule or dispatch (set by nk.proof)
        required: false
        default: dispatch
      grep:
        description: Only tests matching this (e.g. @smoke)
        required: false

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read
  statuses: read

jobs:
  e2e:
    # Fork PRs get no secrets: they can't log in, so they're skipped.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # A variable; also read as a secret in case it was saved as one.
      NKPROOF_URL: ${{ vars.NKPROOF_URL || secrets.NKPROOF_URL }}
      NKPROOF_RUN_ID: ${{ inputs.nkproof_run_id }}
      NKPROOF_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      NKPROOF_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'Deploy preview' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Use the project's package manager (yarn install --frozen-lockfile, pnpm install --frozen-lockfile…).
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Vercel reports the preview as a GitHub deployment of the commit and
      # Netlify as a commit status (netlify/<site>/deploy-preview); waits up
      # to 15 minutes for either.
      - name: Wait for the deploy preview
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for attempt in $(seq 1 60); do
            URL=""
            for ID in $(gh api "repos/$REPO/deployments?sha=$SHA" --jq '.[].id'); do
              read -r STATE DEPLOY_URL <<< "$(gh api "repos/$REPO/deployments/$ID/statuses" --jq '.[0] | "\(.state) \(.environment_url // "")"')"
              case "$STATE" in
                success) [ -n "$DEPLOY_URL" ] && URL=$DEPLOY_URL && break ;;
                failure|error) echo "::error::El deploy preview falló."; exit 1 ;;
              esac
            done
            if [ -z "$URL" ]; then
              read -r STATE CONTEXT TARGET DESCRIPTION <<< "$(gh api "repos/$REPO/commits/$SHA/status" \
                --jq '[.statuses[] | select(.context | test("^netlify/[^/]+/deploy-preview$"))][0] // {} | "\(.state // "none") \(.context // "-") \(.target_url // "-") \(.description // "")"')"
              case "$STATE" in
                success)
                  if echo "$TARGET" | grep -Eq '^https://deploy-preview-[0-9]+--[a-z0-9-]+\.netlify\.app'; then
                    URL=$TARGET
                  else
                    SITE=$(echo "$CONTEXT" | cut -d/ -f2)
                    URL="https://deploy-preview-$PR--$SITE.netlify.app"
                  fi ;;
                failure|error) echo "::error::El deploy preview de Netlify falló: $DESCRIPTION ($TARGET)"; exit 1 ;;
              esac
            fi
            if [ -n "$URL" ]; then
              URL=${URL%/}
              echo "$URL" | grep -Eq '^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._~/-]*)?$' || { echo "::error::URL de preview inesperada."; exit 1; }
              echo "Deploy preview: $URL"
              echo "BASE_URL=$URL" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 15
          done
          echo "::error::El deploy preview no estuvo listo en 15 minutos."
          exit 1

      - name: Use the URL given to Correr
        if: github.event_name == 'workflow_dispatch'
        env:
          URL: ${{ inputs.base_url }}
        run: |
          echo "$URL" | grep -Eq '^https?://[A-Za-z0-9.:-]+(/[A-Za-z0-9._~/-]*)?$' || { echo "::error::base_url no es una URL válida."; exit 1; }
          echo "BASE_URL=${URL%/}" >> "$GITHUB_ENV"

      - name: Describe the run for nk.proof
        env:
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ inputs.source }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            SOURCE=pr
          else
            case "$SOURCE" in schedule|dispatch) ;; *) SOURCE=dispatch ;; esac
          fi
          echo "NKPROOF_SOURCE=$SOURCE" >> "$GITHUB_ENV"
          echo "NKPROOF_PR=$PR" >> "$GITHUB_ENV"
          BRANCH=$(printf '%s' "${HEAD_REF:-$REF_NAME}" | tr -cd '[:alnum:]._/-')
          echo "NKPROOF_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      # Secrets only reach this step: the install above runs dependency
      # scripts, which must not be able to read the token or the password.
      - name: Run Playwright
        env:
          GREP: ${{ inputs.grep }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          NKPROOF_TOKEN: ${{ secrets.NKPROOF_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test ${GREP:+--grep "$GREP"}

      - name: Keep videos and traces of failures
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
